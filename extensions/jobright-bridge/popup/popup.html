<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Resume Agent Bridge</title>
    <style>
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        width: 320px;
        margin: 0;
        padding: 12px;
        background: #0f1419;
        color: #e7ecf1;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
        font-weight: 600;
      }
      .sub {
        font-size: 11px;
        color: #a8b3bf;
        margin: 0 0 12px;
        line-height: 1.4;
      }
      h2 {
        font-size: 12px;
        margin: 12px 0 6px;
        font-weight: 600;
        color: #94a3b8;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        padding: 8px 10px;
        background: #047857;
        color: #fff;
        font-size: 12px;
        cursor: pointer;
        margin-bottom: 8px;
      }
      button.secondary {
        background: #243044;
      }
      button.accent {
        background: #3d8bfd;
      }
      pre {
        white-space: pre-wrap;
        font-size: 11px;
        background: #1a222d;
        padding: 8px;
        border-radius: 6px;
        max-height: 160px;
        overflow: auto;
      }
      label {
        font-size: 11px;
        display: block;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
        padding: 6px;
        border-radius: 4px;
        border: 1px solid #334155;
        background: #111827;
        color: #e7ecf1;
      }
    </style>
  </head>
  <body>
    <h1>Resume Agent Bridge</h1>
    <p class="sub">Jobright 入口 + Apply 填表。默认停在人工确认，不会自动 Submit。</p>

    <h2>Jobright</h2>
    <button id="openTailor">Open Tailor</button>
    <button id="openApply" class="secondary">Open Apply workspace</button>

    <h2>Auto apply (填表)</h2>
    <label for="url">Apply URL</label>
    <input id="url" placeholder="https://company.myworkdayjobs.com/..." />
    <button id="openFill" class="accent">打开并填表</button>
    <button id="refresh" class="secondary">刷新复核摘要</button>
    <pre id="review">尚无复核摘要</pre>
    <script src="popup.js"></script>
  </body>
</html>
