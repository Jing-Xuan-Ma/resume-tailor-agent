<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Data Analyst - Workday Fixture</title>
</head>
<body>
  <h1>Apply — Data Analyst (fixture_workday)</h1>
  <form id="apply">
    <label for="firstName">First Name</label>
    <input id="firstName" name="firstName" type="text" required data-automation-id="legalNameSection_firstName" />

    <label for="lastName">Last Name</label>
    <input id="lastName" name="lastName" type="text" required data-automation-id="legalNameSection_lastName" />

    <label for="email">Email Address</label>
    <input id="email" name="email" type="email" required />

    <label for="phone">Phone Number</label>
    <input id="phone" name="phone" type="tel" />

    <label for="linkedin">LinkedIn Profile URL</label>
    <input id="linkedin" name="linkedin" type="text" />

    <button type="button" id="next">Next</button>
    <button type="submit" id="submit">Submit Application</button>
  </form>
  <pre id="log"></pre>
  <script>
    document.getElementById("apply").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("log").textContent = "SUBMIT_BLOCKED_IN_FIXTURE";
    });
  </script>
</body>
</html>
