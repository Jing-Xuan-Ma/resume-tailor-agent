<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Data Analyst Apply — fixture_workday iframe</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 12px; }
    label { display: block; margin-top: 8px; font-size: 13px; }
    input, select { width: 280px; padding: 4px; }
    .step { display: none; }
    .step.active { display: block; }
    #status { margin-top: 12px; color: #0a7; font-size: 12px; }
  </style>
</head>
<body>
  <h2>Apply — Data Analyst (iframe form)</h2>

  <div id="step1" class="step active">
    <p>Step 1 — Personal info</p>
    <label for="firstName">First Name</label>
    <input id="firstName" name="firstName" type="text" required data-automation-id="legalNameSection_firstName" />

    <label for="lastName">Last Name</label>
    <input id="lastName" name="lastName" type="text" required data-automation-id="legalNameSection_lastName" />

    <label for="email">Email Address</label>
    <input id="email" name="email" type="email" required />

    <label for="phone">Phone Number</label>
    <input id="phone" name="phone" type="tel" />

    <p style="margin-top:12px">
      <button type="button" id="nextBtn">Next</button>
    </p>
  </div>

  <div id="step2" class="step">
    <p>Step 2 — Resume & links (dynamically revealed)</p>
    <label for="linkedin">LinkedIn Profile URL</label>
    <input id="linkedin" name="linkedin" type="text" />

    <label for="resume">Resume/CV</label>
    <input id="resume" name="resume" type="file" accept=".pdf,.docx" required data-automation-id="resume" />

    <label for="auth">Are you legally authorized to work in the United States?</label>
    <select id="auth" name="work_auth">
      <option value="">Select</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <p style="margin-top:12px">
      <button type="submit" id="submitBtn">Submit Application</button>
    </p>
  </div>

  <div id="status"></div>

  <script>
    document.getElementById("nextBtn").addEventListener("click", () => {
      document.getElementById("step1").classList.remove("active");
      document.getElementById("step2").classList.add("active");
      document.getElementById("status").textContent = "STEP2_VISIBLE";
    });
    document.getElementById("submitBtn").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("status").textContent = "SUBMIT_BLOCKED_IN_FIXTURE";
    });
  </script>
</body>
</html>
